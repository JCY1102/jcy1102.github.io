# Rebuilds the site from ORCID every day and on every push, then deploys to GitHub Pages.
# Active only when this folder is the root of the jcy1102.github.io repository
# (Settings > Pages > Source: GitHub Actions).
name: Update from ORCID and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"   # 03:00 KST daily
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/fetch_orcid.py
      - run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
