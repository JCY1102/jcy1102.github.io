  researchgate: https://www.researchgate.net/profile/Chanyoung-Jeong-2
  linkedin: https://www.linkedin.com/in/chanyoung-jeong-975a65316/

summary: >-
  I am a limnologist working on inland and coastal waters. I study how water
  movement and sediment quality shape life on the beds of streams, lakes and
  lagoons, and use benthic macroinvertebrates to read ecosystem condition and
  climate vulnerability.

research:
  - title: "Sediment quality & macroinvertebrate indicators"
    text: "Heavy-metal risk and indicator taxa (Annelida, Chironomidae) across major Korean river basins."
  - title: "Climate vulnerability of stream fauna"
    text: "Thermal baselines, tolerance indices and habitat models for headwater species."
  - title: "Groundwater–surface water ecohydrology"
    text: "Nitrate reduction, isotopes and microbes in the hyporheic zone of Songjiho lagoon."

