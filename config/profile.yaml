# Hand-written content. Everything else (education, experience, licenses,
# publications) is pulled from ORCID by scripts/fetch_orcid.py.

orcid: 0000-0002-3833-946X
owner_match: {family: Jeong, given: chanyoung}   # used to bold your name in author lists

name: Chanyoung Jeong
position: "Ph.D. student, Department of Life Sciences, Kyonggi University"
email: heaveninjcy@kyonggi.ac.kr
links:
  researchgate: https://www.researchgate.net/profile/Chanyoung-Jeong-2
  linkedin: https://www.linkedin.com/in/chanyoung-jeong-975a65316/

summary: >-
  I am a limnologist, a scientist who studies rivers, lakes and other inland
  waters. My research focuses on benthic macroinvertebrates, the insects, worms
  and other small animals living on the bottom of streams, lakes and coastal
  lagoons. I use them to assess sediment pollution, groundwater–surface water
  interactions and the impacts of climate change on freshwater ecosystems.
summary_emphasis: benthic macroinvertebrates   # highlighted in the summary on the homepage

research:
  - title: "Sediment quality & macroinvertebrate indicators"
    text: "Heavy-metal risk and indicator taxa (Annelida, Chironomidae) across major Korean river basins."
  - title: "Climate vulnerability of stream fauna"
    text: "Thermal baselines, tolerance indices and habitat models for headwater species."
  - title: "Groundwater–surface water ecohydrology"
    text: "Nitrate reduction, isotopes and microbes in the hyporheic zone of Songjiho lagoon."

